# Builds the plugin for every platform VCV Rack supports, on every push and
# pull request, natively with VCV's Rack SDK on GitHub's Linux, Windows and
# Mac machines. Each build's .vcvplugin is kept as a downloadable artifact of
# the run (for testers). Untagged builds get the commit added to their version,
# e.g. 2.1.0-8ff5b05, so test builds can be told apart.
#
# Pushing a tag vX.Y.Z (matching "version" in plugin.json) also creates a
# GitHub pre-release with all four packages attached. The VCV Library builds
# the plugin itself from source; these packages are for testing.
name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  rack-sdk-version: latest

defaults:
  run:
    shell: bash

jobs:
  build-lin:
    name: lin-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the commit to the version (untagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="$(jq -r .version plugin.json)-$(git rev-parse --short HEAD)"
          jq --arg v "$v" '.version=$v' plugin.json > plugin.tmp && mv plugin.tmp plugin.json
          echo "version $v"
      - name: Get the Rack SDK
        run: |
          sudo apt-get install -y zstd
          cd "$HOME"
          curl -sSfL -o Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-lin-x64.zip
          unzip -q Rack-SDK.zip
      - name: Build
        run: |
          export RACK_DIR="$HOME/Rack-SDK"
          make dep
          make dist
      - uses: actions/upload-artifact@v4
        with:
          name: FikAudio-lin-x64
          path: dist/*.vcvplugin
          if-no-files-found: error

  build-win:
    name: win-x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make zip unzip zstd jq
            mingw-w64-x86_64-gcc
      - name: Add the commit to the version (untagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="$(jq -r .version plugin.json)-$(git rev-parse --short HEAD)"
          jq --arg v "$v" '.version=$v' plugin.json > plugin.tmp && mv plugin.tmp plugin.json
          echo "version $v"
      - name: Get the Rack SDK
        run: |
          curl -sSfL -o /tmp/Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-win-x64.zip
          unzip -q /tmp/Rack-SDK.zip -d /tmp
      - name: Build
        run: |
          export RACK_DIR=/tmp/Rack-SDK
          make dep
          make dist
      - uses: actions/upload-artifact@v4
        with:
          name: FikAudio-win-x64
          path: dist/*.vcvplugin
          if-no-files-found: error

  build-mac:
    name: mac-${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Add the commit to the version (untagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="$(jq -r .version plugin.json)-$(git rev-parse --short HEAD)"
          jq --arg v "$v" '.version=$v' plugin.json > plugin.tmp && mv plugin.tmp plugin.json
          echo "version $v"
      - name: Get the Rack SDK
        run: |
          cd "$HOME"
          curl -sSfL -o Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-${{ matrix.platform }}.zip
          unzip -q Rack-SDK.zip
      - name: Build
        run: |
          if [ "${{ matrix.platform }}" = x64 ]; then export CROSS_COMPILE=x86_64-apple-darwin; else export CROSS_COMPILE=arm64-apple-darwin; fi
          export RACK_DIR="$HOME/Rack-SDK"
          make dep
          make dist
      - uses: actions/upload-artifact@v4
        with:
          name: FikAudio-mac-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  publish:
    name: Pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-lin, build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches plugin.json
        run: |
          v="v$(jq -r .version plugin.json)"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "plugin.json says $v but the tag is ${GITHUB_REF_NAME}"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.vcvplugin --prerelease \
            --title "Fik Audio $GITHUB_REF_NAME (test build)" \
            --notes "Test build. Download the file for your system, put it in Rack's plugins folder (Help > Open user folder, then plugins-...), and restart Rack."
