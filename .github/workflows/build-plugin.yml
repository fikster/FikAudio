# Builds the plugin for every platform VCV Rack supports, on every push and
# pull request. Each build's .vcvplugin is kept as a downloadable artifact of
# the run (for testers). Untagged builds get the commit added to their version,
# e.g. 2.1.0-8ff5b05, so test builds can be told apart.
#
# Pushing a tag vX.Y.Z (matching "version" in plugin.json) also creates a
# GitHub pre-release with all four packages attached. The VCV Library builds
# the plugin itself from source; these packages are for testing.
name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  rack-sdk-version: latest
  rack-plugin-toolchain-dir: /home/build/rack-plugin-toolchain

defaults:
  run:
    shell: bash

jobs:
  build-win-lin:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux:v2
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Add the commit to the version (untagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v="$(jq -r .version plugin.json)-$(git rev-parse --short HEAD)"
          jq --arg v "$v" '.version=$v' plugin.json > plugin.tmp && mv plugin.tmp plugin.json
          echo "version $v"
      - name: Build
        run: |
          export PLUGIN_DIR="$GITHUB_WORKSPACE"
          cd ${{ env.rack-plugin-toolchain-dir }}
          make plugin-build-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: FikAudio-${{ matrix.platform }}
          path: ${{ env.rack-plugin-toolchain-dir }}/plugin-build/*.vcvplugin
          if-no-files-found: error

  build-mac:
    name: mac-${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Add the commit to the version (untagged builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="$(jq -r .version plugin.json)-$(git rev-parse --short HEAD)"
          jq --arg v "$v" '.version=$v' plugin.json > plugin.tmp && mv plugin.tmp plugin.json
          echo "version $v"
      - name: Get the Rack SDK
        run: |
          cd "$HOME"
          curl -sSfL -o Rack-SDK.zip https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-${{ matrix.platform }}.zip
          unzip -q Rack-SDK.zip
      - name: Build
        run: |
          if [ "${{ matrix.platform }}" = x64 ]; then export CROSS_COMPILE=x86_64-apple-darwin; else export CROSS_COMPILE=arm64-apple-darwin; fi
          export RACK_DIR="$HOME/Rack-SDK"
          make dep
          make dist
      - uses: actions/upload-artifact@v4
        with:
          name: FikAudio-mac-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  publish:
    name: Pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-win-lin, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches plugin.json
        run: |
          v="v$(jq -r .version plugin.json)"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "plugin.json says $v but the tag is ${GITHUB_REF_NAME}"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.vcvplugin --prerelease \
            --title "Fik Audio $GITHUB_REF_NAME (test build)" \
            --notes "Test build. Download the file for your system, put it in Rack's plugins folder (Help > Open user folder, then plugins-...), and restart Rack."
